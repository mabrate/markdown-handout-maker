<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Classroom Handout Maker</title><link rel="stylesheet" href="styles.css"></head>
<body class="desktop-app">
  <header class="toolbar">
    <div class="brand"><span class="brand-mark">H</span><div><strong>Handout Maker</strong><small>Markdown to classroom-ready pages</small></div></div>
    <div class="actions">
      <button id="open-folder-button" class="button secondary">Open Folder</button><button id="new-handout-button" class="button secondary">New Handout</button><button id="save-button" class="button secondary">Save</button>
      <label class="layout-control">Page Settings <select id="layout-select" title="Page size and print layout"><option value="letter">Letter</option><option value="letter-landscape">Letter landscape</option><option value="a4">A4</option><option value="half-portrait">Half letter portrait</option><option value="half-landscape">Half letter landscape</option><option value="half-duplicate-portrait">Two portrait half-sheet copies</option><option value="half-duplicate-landscape">Two landscape half-sheet copies</option><option value="booklet">11×17 booklet</option></select></label>
      <button id="export-button" class="button secondary">Export PDF</button><button id="print-button" class="button primary">Print</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="file-panel"><div class="panel-heading"><label>Handout files</label><span id="folder-name">No folder</span><button class="panel-toggle" data-panel="file" type="button" aria-label="Collapse handout files">Hide</button></div><div id="file-tree" class="file-tree"><p class="empty-tree">Choose a folder to begin.</p></div></aside>
    <div class="panel-divider" data-divider="file" role="separator" aria-label="Resize handout files panel" tabindex="0"></div>
    <section class="editor-panel"><div class="panel-heading"><label for="source">Markdown</label><span id="status">No file open</span><button class="panel-toggle" data-panel="editor" type="button" aria-label="Collapse Markdown editor">Hide</button></div><textarea id="source" spellcheck="true" aria-label="Markdown editor"></textarea><details class="syntax-help"><summary>Handout syntax</summary><code>{{lines:3}}</code> answer lines<br><code>{{lines:3:inline}}</code> first line follows question<br><code>{{space:6}}</code> drawing space<br><code>&lt;br&gt;</code> manual break<br><code>:::wrap</code>, <code>:::grid</code>, <code>:::pagebreak</code></details></section>
    <div class="panel-divider" data-divider="editor" role="separator" aria-label="Resize Markdown editor panel" tabindex="0"></div>
    <section class="preview-panel"><div class="preview-heading"><span>Print preview</span><span id="page-count">0 pages</span></div><div id="preview" aria-live="polite"></div></section>
  </main>
  <input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden><input id="folder-input" type="file" webkitdirectory multiple hidden>
  <script src="vendor/markdown-it.min.js"></script><script src="app.js"></script>
</body></html>
